# electron-builder config for the W6 PACKAGED keyring probe — see
# docs/privacy/BETA5-RELEASE-EVIDENCE.md §6.
#
# Deliberately NOT the product config (`electron-builder.yml`). This packages a
# minimal Electron shell whose only entry point is the compiled
# `electron/dist/electron/selftest/packaged-probe.js`, so the §3.4 keyring gate
# and the §2.3 capability table can be observed from inside a real PACKAGED
# bundle (app.asar, compiled main, packaged Electron runtime) without dragging in
# the renderer bundle, better-sqlite3 and the whole application main process.
#
# It is a shell, and that limit is stated rather than hidden: it proves the gate
# behaves inside a packaged Electron runtime, it does NOT prove the full product
# bundle boots. See §6 for what remains uncovered.
#
# `--dir` only. No installer, no artifact, nothing published.

appId: com.open3dcalc.keyring-probe
productName: Open3DCalcKeyringProbe

directories:
  output: dist-electron-probe

# Exact file set, resolved against the repo root. Every entry is a compiled
# module the probe actually imports; there are no runtime dependencies.
files:
  - package.json
  - electron/dist/electron/osKeyring.js
  - electron/dist/electron/cryptoCapability.js
  - electron/dist/electron/profileDataKey.js
  - electron/dist/electron/selftest/packaged-probe.js
  - electron/dist/src/shared/lib/crypto/capability.js
  - electron/dist/src/shared/lib/crypto/envelope.js
  - electron/dist/src/shared/lib/crypto/passphraseSession.js

# The repo `package.json` is the product's; override only the entry point.
extraMetadata:
  main: electron/dist/electron/selftest/packaged-probe.js

asar: true

# The probe imports no native module. Skipping the native rebuild is not an
# optimisation: electron-builder's @electron/rebuild rewrites the compiled
# better-sqlite3 in node_modules against the ELECTRON ABI IN PLACE, which would
# leave the developer's checkout unable to run the vitest suite (`npm run
# test:run`) after `npm run test:packaged`. A harness that breaks the suite next
# to it is not worth running.
npmRebuild: false

# Nothing here is ever published, from any ref.
publish: null

linux:
  target:
    - dir
  # Fixed name so the harness does not have to guess at productName casing.
  executableName: open3dcalc-keyring-probe
  category: Utility
