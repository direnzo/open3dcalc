---
name: CI/CD

"on":
  push:
    branches: [main]
    # Stable tags also run CI/CD so the tag-gated build-web job below can
    # publish the stable Pages bundle from the immutable tag. Beta tags
    # (vX.Y.Z-beta.N) are excluded: beta-deploy.yml publishes those to /beta/.
    tags:
      - "v*.*.*"
      - "!v*-*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # NOTE: runs on fork PRs too — public ubuntu-latest runner, read-only
    # token, no writable secrets. Required check for external contributors.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: 🔒 Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: 📦 Dependency audit
        run: npm audit --omit=optional --audit-level=critical
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3
      - name: 🔍 Lint
        run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run typecheck:electron
      - run: npm run build:electron
      - name: 🔔 Notify failure
        if: failure()
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "❌ CI/CD failed: $REPO@$REF"
          echo "  https://github.com/$REPO/actions/runs/$RUN_ID"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3
      - run: npm run test:run -- --coverage
      - name: 🔔 Notify failure
        if: failure()
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "❌ CI/CD failed: $REPO@$REF"
          echo "  https://github.com/$REPO/actions/runs/$RUN_ID"
      - name: Upload coverage
        if: always() && hashFiles('coverage/') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/

  test-browser:
    # The PII vault against a REAL browser: Chromium + IndexedDB + Web Crypto,
    # via `vitest.browser.config.ts` and `npm run test:browser`.
    #
    # A separate job on purpose. `*.browser.test.ts` is EXCLUDED from the jsdom
    # run (jsdom has no IndexedDB and reports `isSecureContext: undefined`), so
    # this job is the only thing that collects those specs — losing it would not
    # fail the `test` job, it would silently stop running them. Keeping it
    # separate also stops the Chromium install (~1-2 min, plus Playwright's OS
    # packages) from eating the jsdom suite's 15-minute budget.
    #
    # Headless is pinned in the config (`browser.headless: true`), so no xvfb is
    # needed: the specs open no window and assert on storage and ciphertext.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: ⚡ Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # Keyed on package-lock so a Playwright upgrade (a new hash) never
          # takes a cache HIT on the previous revision. `restore-keys` may still
          # RESTORE that previous revision's directory on a miss — that is
          # intended: `npx playwright install` below then downloads only the
          # revision the new version actually needs. The key guarantees a stale
          # directory is never reused AS-IS as if it were the requested one.
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Chromium
        # `--with-deps` installs the shared libraries headless Chromium needs on
        # ubuntu-latest (the runner has passwordless sudo). It is a no-op
        # download when the cache above already holds the revision.
        run: npx playwright install --with-deps chromium
      - name: 🌐 Browser vault tests
        run: npm run test:browser
      - name: 🔔 Notify failure
        if: failure()
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "❌ CI/CD failed: $REPO@$REF"
          echo "  https://github.com/$REPO/actions/runs/$RUN_ID"

  test-packaged:
    # The §3.4 keyring gate observed from INSIDE a packaged Electron bundle:
    # `app.asar`, compiled main, packaged runtime — the question the dev
    # self-test could not answer. `npm run test:packaged` packages a minimal
    # probe shell and asserts the gate's verdict is internally consistent.
    #
    # One matrix row per Linux target. The `host` row is ubuntu-latest itself;
    # the other three mount the SAME packaged directory into a distro container
    # (the runner ships Docker) so the shell is proven to LOAD across distro
    # families — that is the whole point of the matrix.
    #
    # What this job does NOT prove, stated so nobody reads more into it: the
    # containers have no D-Bus and no keyring, so every row lands on
    # `denied` / `encryption_unavailable`. The keyring-AVAILABLE path, macOS and
    # Windows keychains, and a real libsecret/kwallet backend are uncovered —
    # see docs/privacy/BETA5-RELEASE-EVIDENCE.md §5/§6.
    #
    # fail-fast: false on purpose: a red ubuntu row must not hide whether
    # debian/fedora loaded, because "loads on all three" is the claim.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `host` is the explicit spelling of "no container" (handled by the
        # probe script) so the baseline runner is a matrix row like any other.
        image: [host, "ubuntu:24.04", "debian:12", "fedora:40"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: Ensure xvfb (headless fallback)
        # The probe tries direct headless first and only reaches for xvfb-run if
        # that fails; install it so the fallback exists on the runner too.
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb
          fi
      - name: Build the packaged probe shell
        # No native rebuild: the probe imports no native module, and
        # electron-builder's @electron/rebuild would rewrite better-sqlite3
        # against the Electron ABI in place (`npmRebuild: false` in
        # electron-builder.probe.yml makes that explicit).
        run: |
          npx tsc -p electron/tsconfig.json
          npx electron-builder --linux --dir --config electron-builder.probe.yml --publish never
      - name: 🔐 Packaged keyring probe (${{ matrix.image }})
        run: npm run test:packaged -- --no-build --image "${{ matrix.image }}"
      - name: 🔔 Notify failure
        if: failure()
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "❌ CI/CD failed: $REPO@$REF"
          echo "  https://github.com/$REPO/actions/runs/$RUN_ID"

  build-web:
    needs: [checks, test]
    # Tag-gated: the stable Pages bundle is published from the immutable stable
    # tag, not from main pushes. Beta tags (vX.Y.Z-beta.N) are excluded here —
    # beta-deploy.yml publishes those under /beta/ instead.
    #
    # Silent-stop hazard: this deploy only fires on stable tags pushed by a
    # non-GITHUB_TOKEN identity (release.yml is manual and cuts tags with a
    # PAT). GitHub suppresses workflow runs for events caused by GITHUB_TOKEN
    # (anti-recursion), so a GITHUB_TOKEN-pushed tag would leave the stable web
    # bundle quietly frozen with no failing job.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # peaceiris only needs contents: write to push the gh-pages branch; the
      # pages: write scope of the retired deploy-pages job is unused here (the
      # Pages source is the gh-pages branch, not an Actions artifact).
      contents: write
    # Shared with beta-deploy.yml: serializes every write to gh-pages so the
    # stable root and the /beta/ subpath never clobber each other mid-deploy.
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - run: npm run build:web
      - name: SPA routing fix
        run: |
          cp -n dist-web/index.web.html dist-web/404.html 2>/dev/null || true
          cp -n dist-web/index.web.html dist-web/index.html 2>/dev/null || true
      # Pages é branch-based (gh-pages) para suportar o subpath /beta/ sem
      # clobberar o estável: a fonte do Pages deve apontar para a branch
      # gh-pages (mudança manual única; ver README.md > Canal Beta). O
      # destination_dir "." publica na raiz; keep_files preserva /beta/.
      - name: Publish to gh-pages root
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          destination_dir: .
          # The web build writes to dist-web, not the action default ./public.
          # Without publish_dir the action does fs.readdir('./public') and
          # fails with ENOENT.
          publish_dir: dist-web
          keep_files: true

  build-desktop:
    needs: [checks, test]
    # Fork guard (same as the quality job): for PR workflows github.ref is
    # refs/pull/<number>/merge, so a ref-based condition would skip the
    # desktop build on every PR. Run on trusted pushes to main AND same-repo
    # PRs; NEVER on fork PRs (which run on untrusted runners).
    if: |
      github.event_name != 'pull_request' ||
      (github.head_ref != '' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - name: ⚡ Cache node_modules
        id: npm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}-${{ runner.os }}
          restore-keys: |
            npm-${{ runner.os }}-
      - if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - if: steps.npm-cache.outputs.cache-hit == 'true'
        run: echo "  ✓ node_modules restored from cache"
      - name: Rebuild native modules
        run: >-
          if ! npm rebuild better-sqlite3; then
            echo "better-sqlite3 rebuild failed on this runner; refusing to
            continue with the desktop build." >&2;
            exit 1;
          fi
      - run: npm run build:desktop
      - name: Verify desktop build
        run: ls -la dist/
